name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Generate iOS platform files
        working-directory: app
        run: flutter create --platforms=ios .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS app (no code signing)
        working-directory: app
        run: flutter build ios --no-codesign --release

      - name: Package IPA from .app bundle
        working-directory: app
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -1)
          echo "Found .app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r clarity-log-unsigned.ipa Payload
          ls -lh clarity-log-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarity-log-ios-v${{ github.run_number }}
          path: app/clarity-log-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
